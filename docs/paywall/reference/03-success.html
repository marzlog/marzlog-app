<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>구독 시작 완료</title>
<!-- 시안 참조용 정적 사본. 수치(간격·글자 크기) 참조만, 색·글꼴은 앱 테마 값을 쓴다. accent 임시값 #FF6A5E -->
<style>
body{margin:0}
a{color:#4A4A4F}a:hover{color:#1C1C1E}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 96px 20px 24px; display: flex; flex-direction: column; gap: 28px; background: #F7F7F5; color: #1C1C1E; font-family: 'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">

<div style="display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center">
<span style="width: 72px; height: 72px; border-radius: 50%; background: #FF6A5E; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</span>
<h1 style="margin: 0; font-size: 26px; line-height: 1.3; font-weight: 700">Plus가 시작됐어요</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #4A4A4F">이제 AI 일기를 마음껏 다시 쓰고,<br>100GB까지 넉넉하게 기록할 수 있어요.</p>
</div>

<div style="background: #FFFFFF; border: 1px solid #E4E4E0; border-radius: 16px; padding: 4px 16px; display: flex; flex-direction: column; font-size: 14px">
<div style="display: flex; justify-content: space-between; align-items: center; height: 48px">
<span style="color: #4A4A4F">플랜</span><span style="font-weight: 700">Plus 연간</span>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; height: 48px; border-top: 1px solid #EFEFEC">
<span style="color: #4A4A4F">무료 체험 종료</span><span style="font-weight: 500">[체험 종료일]</span>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; height: 48px; border-top: 1px solid #EFEFEC">
<span style="color: #4A4A4F">첫 결제</span><span style="font-weight: 500">[결제일] · ₩44,000</span>
</div>
</div>

<p style="margin: 0; font-size: 13px; line-height: 1.55; color: #4A4A4F; text-align: center">체험 기간에 해지하면 결제되지 않아요.<br>구독은 설정에서 언제든 관리할 수 있어요.</p>

<div style="display: flex; flex-direction: column; gap: 4px; margin-top: auto">
<button type="button" style="width: 100%; height: 56px; border: 0; border-radius: 999px; background: #FF6A5E; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer">기록하러 가기</button>
<button type="button" style="width: 100%; height: 48px; border: 0; background: transparent; color: #4A4A4F; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer">구독 관리 보기</button>
</div>

</div>
</body>
</html>
