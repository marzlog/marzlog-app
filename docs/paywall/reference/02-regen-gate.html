<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>진입점: 재생성 제한 안내</title>
<!-- 시안 참조용 정적 사본. 수치(간격·글자 크기) 참조만, 색·글꼴은 앱 테마 값을 쓴다. accent 임시값 #FF6A5E -->
<style>
body{margin:0}
a{color:#4A4A4F}a:hover{color:#1C1C1E}
</style>
</head>
<body>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F7F7F5; color: #1C1C1E; font-family: 'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">

<div style="padding: 12px 20px; display: flex; flex-direction: column; gap: 16px">
<div style="height: 44px; display: flex; align-items: center; justify-content: space-between">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1C1C1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
<span style="font-size: 16px; font-weight: 700">일기 상세</span>
<span style="width: 24px"></span>
</div>
<div style="height: 280px; border-radius: 16px; background: #E4E4E0; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #4A4A4F">[사진]</div>
<div style="background: #FFFFFF; border: 1px solid #E4E4E0; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; color: #4A4A4F">[AI 일기 본문]</span>
<span style="height: 12px; border-radius: 6px; background: #EFEFEC"></span>
<span style="height: 12px; border-radius: 6px; background: #EFEFEC; width: 86%"></span>
<span style="height: 12px; border-radius: 6px; background: #EFEFEC; width: 62%"></span>
</div>
</div>

<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(0,0,0,0.45)"></div>

<div style="position: absolute; left: 0; bottom: 0; width: 390px; box-sizing: border-box; padding: 10px 20px 28px; background: #FFFFFF; border-radius: 24px 24px 0 0; display: flex; flex-direction: column; gap: 16px">
<span style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #D9D9D4"></span>
<div style="display: flex; flex-direction: column; gap: 8px; padding-top: 4px">
<span style="font-size: 13px; font-weight: 700; color: #4A4A4F">Marzlog Plus</span>
<h2 style="margin: 0; font-size: 21px; line-height: 1.35; font-weight: 700">AI 일기 재생성은<br>Plus에서 할 수 있어요</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #4A4A4F">Plus에서는 마음에 들 때까지 다시 쓸 수 있어요. 100GB 저장 공간도 함께 드려요.</p>
</div>
<div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: #F7F7F5; font-size: 14px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C1C1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M8 3v4M16 3v4M4 10h16"></path></svg>
<span>처음 구독하면 14일 동안 무료예요</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<button type="button" style="width: 100%; height: 56px; border: 0; border-radius: 999px; background: #FF6A5E; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer">Plus 알아보기</button>
<button type="button" style="width: 100%; height: 48px; border: 0; background: transparent; color: #4A4A4F; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer">다음에 할게요</button>
</div>
</div>

</div>
</body>
</html>
